[project]
name = "mattergraph-research"
version = "0.1.0"
description = "Research loop for MatterGraph: genome search, evaluation, atlas, retrieval"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "torch>=2.2",
  "transformers>=4.49,<5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mattergraph_research"]
